name: unit tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the level-A requirements
        run: pip install -r requirements-reproduce.txt
      - name: Run the 127 unit tests (engine, fixes.py and the region wizard; no data download needed)
        run: pytest -q
