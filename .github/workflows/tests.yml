name: unit tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the requirements of reproduce.py and of the tests
        run: pip install -r requirements-reproduce.txt
      - name: Run the unit tests (engine, fixes.py, the region wizard, notebooks 10, 11 and 25 offline; no data download needed)
        run: pytest -q
